
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Horizon | Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'DM Sans', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #081725;
    position: relative;
}

/* Animated background image */
.background {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(120deg, rgba(5,16,30,.88), rgba(9,28,43,.65)),
        url("https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=2000&q=90");
    background-size: cover;
    background-position: center;
    animation: backgroundZoom 22s ease-in-out infinite alternate;
    z-index: -3;
}

@keyframes backgroundZoom {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
}

/* Floating light effects */
body::before,
body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .25;
    z-index: -2;
    animation: floatGlow 9s ease-in-out infinite alternate;
    pointer-events: none;
}

body::before {
    background: #c69d5c;
    top: -150px;
    left: -100px;
}

body::after {
    background: #28617c;
    bottom: -180px;
    right: -100px;
    animation-delay: 2s;
}

@keyframes floatGlow {
    from { transform: translate(0,0); }
    to { transform: translate(70px,50px); }
}

/* Login card */
.login-box {
    width: 420px;
    max-width: calc(100% - 35px);
    padding: 42px 38px;
    border-radius: 22px;
    background: rgba(9, 27, 42, .78);
    border: 1px solid rgba(220, 190, 135, .35);
    box-shadow: 0 25px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    animation: cardAppear .9s ease both;
    position: relative;
    overflow: hidden;
}

.login-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 70%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #e6c17e, transparent);
    animation: shine 5s linear infinite;
}

@keyframes shine {
    to { left: 130%; }
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.logo {
    text-align: center;
    color: #dfbd7d;
    font-family: 'Playfair Display', serif;
    font-size: 29px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.logo-line {
    width: 65px;
    height: 2px;
    background: #c9a66d;
    margin: 14px auto 25px;
}

h2 {
    text-align: center;
    color: #fff;
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 9px;
}

.subtitle {
    text-align: center;
    color: #b9c3cc;
    font-size: 13px;
    margin-bottom: 32px;
}

label {
    display: block;
    color: #e5d6bb;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 9px;
}

.input-box {
    position: relative;
    margin-bottom: 22px;
}

.input-box input {
    width: 100%;
    height: 51px;
    padding: 0 45px 0 15px;
    border: 1px solid rgba(255,255,255,.17);
    border-radius: 9px;
    outline: none;
    background: rgba(255,255,255,.08);
    color: white;
    font-size: 14px;
    transition: .3s;
}

.input-box input::placeholder {
    color: #a4adb7;
}

.input-box input:focus {
    border-color: #d5b273;
    background: rgba(255,255,255,.12);
    box-shadow: 0 0 0 3px rgba(213,178,115,.12);
}

.field-icon {
    position: absolute;
    right: 15px;
    top: 15px;
    color: #d5b273;
    font-size: 17px;
}

.toggle-password {
    cursor: pointer;
    user-select: none;
}

.login-button {
    width: 100%;
    height: 52px;
    margin-top: 8px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(110deg, #b58a4e, #e4c58c, #b58a4e);
    background-size: 200% auto;
    color: #102234;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .4s;
    box-shadow: 0 8px 25px rgba(190,150,85,.2);
}

.login-button:hover {
    background-position: right center;
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(190,150,85,.35);
}

.login-button:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

#message {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    min-height: 18px;
    overflow-wrap: anywhere;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #d7b77e;
    text-decoration: none;
    font-size: 13px;
    transition: .3s;
}

.back:hover {
    color: white;
    letter-spacing: .5px;
}

.footer-text {
    text-align: center;
    color: rgba(255,255,255,.45);
    font-size: 10px;
    margin-top: 28px;
    letter-spacing: 1px;
}

@media(max-width: 480px) {
    .login-box {
        padding: 35px 24px;
    }

    .logo {
        font-size: 24px;
    }

    h2 {
        font-size: 26px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="login-box">

    <div class="logo">GRAND HORIZON</div>
    <div class="logo-line"></div>

    <h2>Admin Portal</h2>
    <p class="subtitle">Welcome back! Sign in to manage your hotel.</p>

    <form id="loginForm">

        <label for="username">Username</label>

        <div class="input-box">
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
                required>
            <span class="field-icon">♙</span>
        </div>

        <label for="password">Password</label>

        <div class="input-box">
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>
            <span class="field-icon toggle-password"
                  id="togglePassword"
                  title="Show password">◉</span>
        </div>

        <button type="submit" class="login-button" id="loginButton">
            SIGN IN
        </button>

        <p id="message" role="status" aria-live="polite"></p>

    </form>

    <a href="/index.html" class="back">← Back to Hotel Website</a>

    <div class="footer-text">
        © 2026 GRAND HORIZON HOTEL · ADMINISTRATION
    </div>

</div>

<script>

const loginForm = document.getElementById("loginForm");

const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function() {

    const passwordInput = document.getElementById("password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.innerText = "◎";
        togglePassword.title = "Hide password";
    } else {
        passwordInput.type = "password";
        togglePassword.innerText = "◉";
        togglePassword.title = "Show password";
    }

});

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();

    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    const button = document.getElementById("loginButton");

    button.disabled = true;
    button.innerText = "AUTHENTICATING...";
    message.innerText = "";

    try {

        const response = await fetch("/api/admin/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "same-origin",

            body: JSON.stringify({
                username: username,
                password: password
            })

        });

        const result = await response.text();

        if (response.ok) {

            message.style.color = "#8ee0a7";
            message.innerText = "Login Successful! Redirecting...";

            window.location.replace("/admin-dashboard.html");

        } else {

            message.style.color = "#ff9999";
            message.innerText = result || "Invalid username or password.";

        }

    } catch (error) {

        console.error("Login error:", error);

        message.style.color = "#ff9999";
        message.innerText = "Server connection failed. Please try again.";

    } finally {

        button.disabled = false;
        button.innerText = "SIGN IN";

    }

});

</script>

</body>
</html>
