
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grand Horizon | Create Account</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;

    background:
      linear-gradient(120deg, rgba(5,15,30,.82), rgba(12,24,40,.55)),
      url("https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1920");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    overflow-x: hidden;
}

/* Animated background */
body::before,
body::after {
    content: "";
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    animation: float 8s infinite alternate;
    pointer-events: none;
}

body::before {
    background: #d6a85c;
    top: -100px;
    left: -100px;
}

body::after {
    background: #237a9b;
    bottom: -120px;
    right: -100px;
    animation-delay: 2s;
}

@keyframes float {
    from { transform: translate(0,0); }
    to { transform: translate(100px,80px); }
}

/* Main container */
.auth-container {
    width: 100%;
    max-width: 1050px;
    min-height: 680px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    z-index: 1;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 24px;
    background: rgba(255,255,255,.10);
    backdrop-filter: blur(18px);
    box-shadow: 0 25px 70px rgba(0,0,0,.4);
    animation: appear .8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(35px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Left panel */
.welcome-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 55px;
    color: white;
}

.brand {
    color: #e8bd73;
    font-size: 17px;
    letter-spacing: 4px;
    font-weight: 700;
    margin-bottom: 28px;
}

.welcome-panel h1 {
    font-size: clamp(35px, 4vw, 52px);
    line-height: 1.15;
    margin-bottom: 22px;
}

.welcome-panel p {
    color: #e0e4e9;
    line-height: 1.8;
    font-size: 16px;
}

.gold-line {
    width: 75px;
    height: 4px;
    background: #e8bd73;
    margin: 25px 0;
    border-radius: 10px;
}

/* Right panel */
.form-panel {
    background: rgba(255,255,255,.96);
    padding: 45px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.form-panel h2 {
    color: #15283c;
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #7b8490;
    margin-bottom: 22px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    color: #344256;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid #dce1e8;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    transition: .3s;
    background: #f9fafc;
}

.form-group input:focus {
    border-color: #c49a54;
    box-shadow: 0 0 0 4px rgba(196,154,84,.14);
    background: white;
}

/* Button */
.auth-btn {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(110deg, #b68b49, #e2bd79);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: .3s;
    box-shadow: 0 7px 18px rgba(182,139,73,.25);
}

.auth-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(182,139,73,.4);
}

.auth-btn:disabled {
    opacity: .7;
    cursor: wait;
}

.auth-link {
    margin-top: 20px;
    text-align: center;
    color: #707986;
    font-size: 14px;
}

.auth-link a {
    color: #ae803b;
    font-weight: 700;
    text-decoration: none;
}

.auth-link a:hover {
    text-decoration: underline;
}

.message {
    margin-top: 12px;
    font-size: 14px;
    color: #d13d3d;
    text-align: center;
    overflow-wrap: anywhere;
}

/* Mobile responsive */
@media(max-width: 750px) {
    body {
        padding: 15px;
    }

    .auth-container {
        grid-template-columns: 1fr;
        max-width: 480px;
    }

    .welcome-panel {
        padding: 30px;
        min-height: 220px;
    }

    .welcome-panel h1 {
        font-size: 34px;
    }

    .form-panel {
        padding: 35px 25px;
    }
}
</style>
</head>

<body>

<div class="auth-container">

    <!-- Welcome Section -->
    <div class="welcome-panel">

        <div class="brand">GRAND HORIZON</div>

        <h1>Begin Your Journey.</h1>

        <div class="gold-line"></div>

        <p>
            Create your account and experience a new
            level of hospitality. Discover beautiful rooms,
            premium facilities and unforgettable stays.
        </p>

    </div>

    <!-- Registration Form -->
    <div class="form-panel">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join Grand Horizon and enjoy luxury stays.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text"
                       id="name"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       id="password"
                       placeholder="Create a password"
                       minlength="8"
                       required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm your password"
                       minlength="8"
                       required>
            </div>

            <button type="submit" class="auth-btn">
                Create My Account →
            </button>

        </form>

        <p id="message" class="message"></p>

        <div class="auth-link">
            Already have an account?
            <a href="login.html">Login Here</a>
        </div>

    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit",
async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("message");
    const button = document.querySelector(".auth-btn");

    message.style.color = "#d13d3d";

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match!";
        return;
    }

    if (password.length < 8) {
        message.textContent = "Password must contain at least 8 characters.";
        return;
    }

    button.disabled = true;
    button.textContent = "Creating Account...";
    message.textContent = "";

    try {

        const response = await fetch("/api/users/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })
        });

        if (!response.ok) {
            throw new Error(
                "Registration failed. Email may already exist."
            );
        }

        message.style.color = "green";
        message.textContent =
            "Account created successfully! Redirecting to login...";

        setTimeout(function() {
            window.location.href = "login.html";
        }, 1500);

    } catch(error) {

        message.textContent = error.message;

    } finally {

        button.disabled = false;
        button.textContent = "Create My Account →";

    }

});

</script>

</body>
</html>
